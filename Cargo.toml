[workspace]
members = ["crates/*", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.6"
authors = ["Levi Laine <shiueo.csh@gmail.com>"]
repository = "https://github.com/levish0/modkei"
description = "Analyze Rust code and visualize file dependencies as an interactive graph."
edition = "2024"
rust-version = "1.95.0"
license = "Apache-2.0"
keywords = ["cli", "statistics", "graph", "analysis"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[workspace.dependencies]
# Internal crates
modkei-core = { path = "crates/modkei-core", version = "0.1.6" }
modkei-report = { path = "crates/modkei-report", version = "0.1.6" }

# External dependencies
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
ignore = "0.4.25"
rayon = "1.12.0"
crossbeam-channel = "0.5.15"
indicatif = "0.18.4"
serde = { version = "1.0.228", features = ["derive"] }
tiny_http = "0.12.0"
rust-embed = "8.11.0"
mime_guess = "2.0.5"
serde_json = "1.0.149"
ra_ap_ide = "0.0.332"
ra_ap_load-cargo = "0.0.331"
ra_ap_project_model = "0.0.331"
ra_ap_syntax = "0.0.331"
ra_ap_vfs = "0.0.331"
open = "5.3.4"
ctrlc = "3.5.2"
