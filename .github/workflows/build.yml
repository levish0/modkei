name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install UI dependencies
        working-directory: modkei-ui
        run: pnpm install --frozen-lockfile

      - name: Build UI (generates static-report for rust-embed)
        run: cargo xtask build-ui

      - name: Release Build
        run: cargo build --release