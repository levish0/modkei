<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>modkei graph</title>
  <style>
    :root { color-scheme: dark; --bg: #0b0f17; --panel: rgba(16, 22, 34, .78); --text: #d8dee9; --muted: #8b95a7; }
    * { box-sizing: border-box; }
    body { margin: 0; overflow: hidden; background: radial-gradient(circle at 20% 20%, #1d2637 0, transparent 34%), radial-gradient(circle at 80% 0%, #14231f 0, transparent 28%), var(--bg); color: var(--text); font: 14px/1.4 ui-sans-serif, system-ui, sans-serif; }
    #sigma-container { position: absolute; inset: 0; }
    #info-panel { position: absolute; top: 16px; left: 16px; width: min(380px, calc(100vw - 32px)); padding: 16px; border: 1px solid #2b3446; border-radius: 16px; background: var(--panel); backdrop-filter: blur(18px); box-shadow: 0 18px 60px rgba(0, 0, 0, .35); }
    h1 { margin: 0 0 8px; font-size: 18px; letter-spacing: .02em; }
    .muted { color: var(--muted); }
    #search { width: 100%; margin-top: 12px; border: 1px solid #303a4d; border-radius: 999px; padding: 10px 12px; outline: none; background: #0f1521; color: var(--text); }
    #legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 999px; background: #121a28; color: var(--muted); }
    .dot { width: 9px; height: 9px; border-radius: 50%; }
    #selection { margin-top: 12px; overflow-wrap: anywhere; }
    .controls { margin-top: 14px; display: grid; gap: 10px; }
    .section-title { margin-top: 14px; color: #f8fafc; font-weight: 700; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    .control { display: grid; grid-template-columns: 1fr 64px; gap: 8px; align-items: center; color: var(--muted); }
    .control label { display: flex; justify-content: space-between; gap: 12px; grid-column: 1 / -1; }
    input[type="range"] { width: 100%; accent-color: #8aa8ff; }
    .toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="sigma-container"></div>
  <aside id="info-panel">
    <h1>modkei dependency graph</h1>
    <div class="muted"><span id="counts"></span>. Drag nodes, scroll to zoom, click a node to inspect neighbors.</div>
    <input id="search" placeholder="Filter files..." autocomplete="off">
    <div class="section-title">Display</div>
    <div class="controls">
      <div class="control"><label>Text fade threshold <span id="text-threshold-value"></span></label><input id="text-threshold" type="range" min="0" max="24" step="1" value="8"></div>
      <div class="control"><label>Node size <span id="node-size-value"></span></label><input id="node-size" type="range" min="0.4" max="3" step="0.05" value="1"></div>
      <div class="control"><label>Link thickness <span id="link-thickness-value"></span></label><input id="link-thickness" type="range" min="0.2" max="5" step="0.1" value="1.8"></div>
      <label class="toggle">Arrows <input id="show-arrows" type="checkbox"></label>
      <label class="toggle">Show orphans <input id="show-orphans" type="checkbox" checked></label>
    </div>
    <div class="section-title">Forces</div>
    <div class="controls">
      <div class="control"><label>Center force <span id="center-value"></span></label><input id="center-force" type="range" min="0" max="1" step="0.01" value="0.28"></div>
      <div class="control"><label>Repel force <span id="repel-value"></span></label><input id="repel-force" type="range" min="0" max="1000" step="10" value="360"></div>
      <div class="control"><label>Link force <span id="link-value"></span></label><input id="link-force" type="range" min="0" max="1" step="0.01" value="0.18"></div>
      <div class="control"><label>Link distance <span id="distance-value"></span></label><input id="link-distance" type="range" min="5" max="220" step="1" value="70"></div>
    </div>
    <div id="legend"></div>
    <div id="selection" class="muted">No file selected.</div>
  </aside>
  <script src="https://cdn.jsdelivr.net/npm/graphology@0.26.0/dist/graphology.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sigma@3.0.2/dist/sigma.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-force@3.0.0/dist/d3-force.min.js"></script>
  <script>
    const GRAPH = __GRAPH_JSON__;
    const COLORS = { Rust: "#dea584", TypeScript: "#3178c6", JavaScript: "#f7df1e", Python: "#ffd343", Go: "#00add8" };
    window.addEventListener("error", event => {
      document.getElementById("selection").textContent = `Graph error: ${event.message}`;
    });
    const graph = new graphology.DirectedGraph();
    const languages = new Map();
    const degree = new Map();
    GRAPH.nodes.forEach(node => degree.set(node.id, 0));
    GRAPH.edges.forEach(edge => {
      degree.set(edge.source, (degree.get(edge.source) || 0) + 1);
      degree.set(edge.target, (degree.get(edge.target) || 0) + 1);
    });
    const maxDegree = Math.max(1, ...degree.values());
    GRAPH.nodes.forEach((node, index) => {
      const angle = index / Math.max(1, GRAPH.nodes.length) * Math.PI * 2;
      const color = COLORS[node.language] || "#aab2c0";
      const nodeDegree = degree.get(node.id) || 0;
      const baseSize = 3.4 + Math.sqrt(nodeDegree + 1) * 1.8 + Math.log2(node.code + 2) * 0.35;
      languages.set(node.language, color);
      graph.addNode(node.id, { label: node.label, language: node.language, degree: nodeDegree, baseColor: color, size: baseSize, baseSize, color, labelColor: "#f8fafc", x: Math.cos(angle) * 180 + Math.random(), y: Math.sin(angle) * 180 + Math.random(), hidden: false });
    });
    GRAPH.edges.forEach((edge, index) => {
      if (graph.hasNode(edge.source) && graph.hasNode(edge.target) && !graph.hasDirectedEdge(edge.source, edge.target)) graph.addDirectedEdgeWithKey(`${edge.source}->${edge.target}:${index}`, edge.source, edge.target, { label: edge.label, color: "#8c96aa", baseColor: "#8c96aa", size: 1.8, baseSize: 1.8 });
    });
    const displayControls = {
      textThreshold: document.getElementById("text-threshold"),
      nodeSize: document.getElementById("node-size"),
      linkThickness: document.getElementById("link-thickness"),
      showArrows: document.getElementById("show-arrows"),
      showOrphans: document.getElementById("show-orphans")
    };
    const forceControls = {
      center: document.getElementById("center-force"),
      repel: document.getElementById("repel-force"),
      link: document.getElementById("link-force"),
      distance: document.getElementById("link-distance")
    };
    function forceSettings() {
      return {
        center: Number(forceControls.center.value),
        repel: Number(forceControls.repel.value),
        link: Number(forceControls.link.value),
        distance: Number(forceControls.distance.value)
      };
    }
    function displaySettings() {
      return {
        textThreshold: Number(displayControls.textThreshold.value),
        nodeSize: Number(displayControls.nodeSize.value),
        linkThickness: Number(displayControls.linkThickness.value),
        showArrows: displayControls.showArrows.checked,
        showOrphans: displayControls.showOrphans.checked
      };
    }
    function updateControlLabels() {
      const settings = forceSettings();
      const display = displaySettings();
      document.getElementById("text-threshold-value").textContent = display.textThreshold.toFixed(0);
      document.getElementById("node-size-value").textContent = display.nodeSize.toFixed(2);
      document.getElementById("link-thickness-value").textContent = display.linkThickness.toFixed(1);
      document.getElementById("center-value").textContent = settings.center.toFixed(2);
      document.getElementById("repel-value").textContent = settings.repel.toFixed(0);
      document.getElementById("link-value").textContent = settings.link.toFixed(2);
      document.getElementById("distance-value").textContent = settings.distance.toFixed(0);
    }
    const simulationNodes = GRAPH.nodes.map(node => ({
      id: node.id,
      x: graph.getNodeAttribute(node.id, "x"),
      y: graph.getNodeAttribute(node.id, "y")
    }));
    const simulationNodeById = new Map(simulationNodes.map(node => [node.id, node]));
    const simulationLinks = GRAPH.edges
      .filter(edge => simulationNodeById.has(edge.source) && simulationNodeById.has(edge.target))
      .map(edge => ({ source: edge.source, target: edge.target }));
    const simulation = d3.forceSimulation(simulationNodes)
      .alpha(1)
      .alphaDecay(0.035)
      .velocityDecay(0.48)
      .force("centerX", d3.forceX(0))
      .force("centerY", d3.forceY(0))
      .force("charge", d3.forceManyBody())
      .force("link", d3.forceLink(simulationLinks).id(node => node.id));
    function applyForces() {
      const settings = forceSettings();
      simulation.force("centerX").strength(settings.center);
      simulation.force("centerY").strength(settings.center);
      simulation.force("charge").strength(-settings.repel);
      simulation.force("link").strength(settings.link).distance(settings.distance);
      simulation.alpha(Math.max(simulation.alpha(), 0.65)).restart();
    }
    function syncSimulation() {
      for (const node of simulationNodes) {
        if (!graph.hasNode(node.id)) continue;
        graph.setNodeAttribute(node.id, "x", node.x);
        graph.setNodeAttribute(node.id, "y", node.y);
      }
      renderer.refresh();
    }
    updateControlLabels();
    document.getElementById("counts").textContent = `${graph.order} files, ${graph.size} imports`;
    document.getElementById("legend").innerHTML = [...languages.entries()].map(([lang, color]) => `<span class="pill"><span class="dot" style="background:${color}"></span>${lang}</span>`).join("");
    const SigmaRenderer = Sigma.default || Sigma.Sigma || Sigma;
    function roundRect(context, x, y, width, height, radius) {
      const r = Math.min(radius, width / 2, height / 2);
      context.beginPath();
      context.moveTo(x + r, y);
      context.arcTo(x + width, y, x + width, y + height, r);
      context.arcTo(x + width, y + height, x, y + height, r);
      context.arcTo(x, y + height, x, y, r);
      context.arcTo(x, y, x + width, y, r);
      context.closePath();
    }
    function drawLabel(context, data, settings) {
      if (!data.label) return;
      const size = settings.labelSize;
      context.font = `${settings.labelWeight} ${size}px ${settings.labelFont}`;
      const textWidth = context.measureText(data.label).width;
      const x = data.x + data.size + 6;
      const y = data.y + size / 3;
      roundRect(context, x - 5, y - size, textWidth + 10, size + 7, 5);
      context.fillStyle = "rgba(10, 15, 24, 0.86)";
      context.fill();
      context.fillStyle = data.labelColor || "#f8fafc";
      context.fillText(data.label, x, y);
    }
    function drawHover(context, data, settings) {
      if (!data.label) return;
      const size = settings.labelSize + 1;
      context.font = `700 ${size}px ${settings.labelFont}`;
      const textWidth = context.measureText(data.label).width;
      const nodeRadius = data.size + 3;
      context.beginPath();
      context.arc(data.x, data.y, nodeRadius, 0, Math.PI * 2);
      context.fillStyle = data.color || "#8aa8ff";
      context.fill();
      context.lineWidth = 2;
      context.strokeStyle = "#f8fafc";
      context.stroke();
      const x = data.x + nodeRadius + 8;
      const y = data.y + size / 3;
      roundRect(context, x - 7, y - size - 2, textWidth + 14, size + 10, 7);
      context.fillStyle = "rgba(10, 15, 24, 0.96)";
      context.fill();
      context.strokeStyle = "rgba(148, 163, 184, 0.45)";
      context.stroke();
      context.fillStyle = "#f8fafc";
      context.fillText(data.label, x, y);
    }
    const renderer = new SigmaRenderer(graph, document.getElementById("sigma-container"), {
      defaultEdgeColor: "#8c96aa",
      defaultEdgeType: "line",
      labelColor: { color: "#f8fafc" },
      labelWeight: "600",
      labelSize: 13,
      labelRenderedSizeThreshold: Number(displayControls.textThreshold.value),
      defaultDrawNodeLabel: drawLabel,
      defaultDrawNodeHover: drawHover,
      renderEdgeLabels: false
    });
    let focused = null;
    let draggedNode = null;
    let isDragging = false;
    function applyFilter() {
      const query = document.getElementById("search").value.toLowerCase();
      const display = displaySettings();
      graph.forEachNode((node, attrs) => {
        const matchesQuery = !query || node.toLowerCase().includes(query) || attrs.label.toLowerCase().includes(query);
        const isOrphan = graph.degree(node) === 0;
        graph.setNodeAttribute(node, "hidden", !matchesQuery || (!display.showOrphans && isOrphan));
      });
      graph.forEachEdge((edge, attrs, source, target) => graph.setEdgeAttribute(edge, "hidden", graph.getNodeAttribute(source, "hidden") || graph.getNodeAttribute(target, "hidden")));
    }
    function applyDisplay() {
      const display = displaySettings();
      renderer.setSetting("labelRenderedSizeThreshold", display.textThreshold);
      graph.forEachNode((id, attrs) => {
        graph.setNodeAttribute(id, "baseSize", attrs.baseSize / (attrs.nodeScale || 1) * display.nodeSize);
        graph.setNodeAttribute(id, "nodeScale", display.nodeSize);
        graph.setNodeAttribute(id, "size", graph.getNodeAttribute(id, "baseSize"));
      });
      graph.forEachEdge((edge, attrs) => {
        graph.setEdgeAttribute(edge, "baseSize", display.linkThickness);
        graph.setEdgeAttribute(edge, "size", display.linkThickness);
        graph.setEdgeAttribute(edge, "type", display.showArrows ? "arrow" : "line");
      });
      applyFilter();
      updateSelection(focused);
    }
    function updateSelection(node) {
      focused = node && graph.hasNode(node) ? node : null;
      document.getElementById("selection").textContent = focused || "No file selected.";
      graph.forEachNode((id, attrs) => {
        const selected = focused && id === focused;
        const neighbor = focused && graph.areNeighbors(id, focused);
        const dim = focused && !selected && !neighbor;
        graph.setNodeAttribute(id, "color", dim ? "#465064" : attrs.baseColor);
        graph.setNodeAttribute(id, "size", selected ? attrs.baseSize * 1.45 : attrs.baseSize);
        graph.setNodeAttribute(id, "labelColor", dim ? "#9aa4b8" : "#f8fafc");
      });
      graph.forEachEdge((edge, attrs, source, target) => {
        const connected = focused && (source === focused || target === focused);
        const dim = focused && !connected;
        graph.setEdgeAttribute(edge, "color", dim ? "#30394a" : "#a8b2c6");
        graph.setEdgeAttribute(edge, "size", connected ? attrs.baseSize * 1.7 : attrs.baseSize);
      });
      renderer.refresh();
    }
    simulation.on("tick", syncSimulation);
    applyForces();
    renderer.on("clickNode", event => {
      if (isDragging || !event.node || !graph.hasNode(event.node)) return;
      updateSelection(focused === event.node ? null : event.node);
    });
    renderer.on("clickStage", () => {
      updateSelection(null);
    });
    renderer.on("downNode", event => {
      if (!event.node || !graph.hasNode(event.node)) return;
      isDragging = true;
      draggedNode = event.node;
      const simNode = simulationNodeById.get(draggedNode);
      if (simNode) {
        simNode.fx = simNode.x;
        simNode.fy = simNode.y;
      }
      simulation.alphaTarget(0.35).restart();
      graph.setNodeAttribute(draggedNode, "highlighted", true);
      renderer.setSetting("enableCameraPanning", false);
      updateSelection(draggedNode);
      event.event.preventSigmaDefault();
    });
    renderer.getMouseCaptor().on("mousemovebody", event => {
      if (!isDragging || !draggedNode) return;
      if (!graph.hasNode(draggedNode)) return;
      const pos = renderer.viewportToGraph({ x: event.x, y: event.y });
      graph.setNodeAttribute(draggedNode, "x", pos.x);
      graph.setNodeAttribute(draggedNode, "y", pos.y);
      const simNode = simulationNodeById.get(draggedNode);
      if (simNode) {
        simNode.fx = pos.x;
        simNode.fy = pos.y;
      }
      event.preventSigmaDefault();
      event.original.preventDefault();
      event.original.stopPropagation();
    });
    renderer.getMouseCaptor().on("mouseup", () => {
      if (draggedNode) graph.removeNodeAttribute(draggedNode, "highlighted");
      const simNode = draggedNode ? simulationNodeById.get(draggedNode) : null;
      if (simNode) {
        simNode.fx = null;
        simNode.fy = null;
      }
      isDragging = false;
      draggedNode = null;
      simulation.alphaTarget(0);
      renderer.setSetting("enableCameraPanning", true);
    });
    renderer.getMouseCaptor().on("mouseleave", () => {
      if (draggedNode) graph.removeNodeAttribute(draggedNode, "highlighted");
      const simNode = draggedNode ? simulationNodeById.get(draggedNode) : null;
      if (simNode) {
        simNode.fx = null;
        simNode.fy = null;
      }
      isDragging = false;
      draggedNode = null;
      simulation.alphaTarget(0);
      renderer.setSetting("enableCameraPanning", true);
    });
    document.getElementById("search").addEventListener("input", applyFilter);
    Object.values(forceControls).forEach(input => input.addEventListener("input", () => {
      updateControlLabels();
      applyForces();
    }));
    Object.values(displayControls).forEach(input => input.addEventListener("input", () => {
      updateControlLabels();
      applyDisplay();
      renderer.refresh();
    }));
    displayControls.showOrphans.addEventListener("change", applyDisplay);
  </script>
</body>
</html>
